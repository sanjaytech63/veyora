name: Veyora Production Deployment (Render + Vercel)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-gate:
    name: Pre-Deployment Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Align npm with packageManager
        run: npm install --global npm@11.21.0

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Verify compilation, linting, formatting and test suites
        run: |
          npm run typecheck
          npm run lint:check
          npm run format:check
          npm run test
          npm run build

  deploy-render:
    name: Deploy API & Background Worker to Render
    needs: [validate-and-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # ------------------------------------------------------------------------
      # Trigger Render API Web Service Deployment
      # ------------------------------------------------------------------------
      - name: Trigger Render API Deploy Hook
        if: env.RENDER_API_DEPLOY_HOOK_URL != ''
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render API Web Service deployment..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${RENDER_API_DEPLOY_HOOK_URL}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Render API deployment hook dispatched successfully (HTTP $HTTP_CODE)."
          else
            echo "Render API deployment hook returned unexpected status: $HTTP_CODE"
            exit 1
          fi

      - name: Fallback notice for Render API
        if: env.RENDER_API_DEPLOY_HOOK_URL == ''
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          echo "RENDER_API_DEPLOY_HOOK_URL secret is not set. If native Render autoDeploy is enabled on the main branch, Render triggers build automatically on push."

      # ------------------------------------------------------------------------
      # Trigger Render Background Worker Deployment
      # ------------------------------------------------------------------------
      - name: Trigger Render Worker Deploy Hook
        if: env.RENDER_WORKER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render Background Worker deployment..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${RENDER_WORKER_DEPLOY_HOOK_URL}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Render Worker deployment hook dispatched successfully (HTTP $HTTP_CODE)."
          else
            echo "Render Worker deployment hook returned unexpected status: $HTTP_CODE"
            exit 1
          fi

      - name: Fallback notice for Render Worker
        if: env.RENDER_WORKER_DEPLOY_HOOK_URL == ''
        env:
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          echo "RENDER_WORKER_DEPLOY_HOOK_URL secret is not set. If native Render autoDeploy is enabled on the main branch, Render triggers build automatically on push."

      # ------------------------------------------------------------------------
      # Optional Health Verification if production API URL is provided
      # ------------------------------------------------------------------------
      - name: Verify Production API Liveness Probe
        if: env.PRODUCTION_API_URL != ''
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          echo "Waiting 30 seconds for Render rolling deployment to initiate..."
          sleep 30
          echo "Probing API at ${PRODUCTION_API_URL}/health/live..."
          curl -s -f --retry 10 --retry-delay 10 --retry-connrefused "${PRODUCTION_API_URL}/health/live"
          echo "Production API liveness check passed."

  deploy-vercel:
    name: Trigger Vercel Deployments (Web & Admin)
    needs: [validate-and-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Trigger Vercel Web Deploy Hook
        if: env.VERCEL_WEB_DEPLOY_HOOK_URL != ''
        env:
          VERCEL_WEB_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_WEB_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel Web Storefront deployment..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${VERCEL_WEB_DEPLOY_HOOK_URL}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Vercel Web deployment hook dispatched successfully (HTTP $HTTP_CODE)."
          else
            echo "Vercel Web deploy hook returned unexpected status: $HTTP_CODE"
            exit 1
          fi

      - name: Fallback notice for Vercel Web
        if: env.VERCEL_WEB_DEPLOY_HOOK_URL == ''
        env:
          VERCEL_WEB_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_WEB_DEPLOY_HOOK_URL }}
        run: |
          echo "VERCEL_WEB_DEPLOY_HOOK_URL is not set. Vercel native GitHub integration will automatically build and deploy apps/web on push to main."

      - name: Trigger Vercel Admin Deploy Hook
        if: env.VERCEL_ADMIN_DEPLOY_HOOK_URL != ''
        env:
          VERCEL_ADMIN_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_ADMIN_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel Admin Portal deployment..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${VERCEL_ADMIN_DEPLOY_HOOK_URL}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Vercel Admin deployment hook dispatched successfully (HTTP $HTTP_CODE)."
          else
            echo "Vercel Admin deploy hook returned unexpected status: $HTTP_CODE"
            exit 1
          fi

      - name: Fallback notice for Vercel Admin
        if: env.VERCEL_ADMIN_DEPLOY_HOOK_URL == ''
        env:
          VERCEL_ADMIN_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_ADMIN_DEPLOY_HOOK_URL }}
        run: |
          echo "VERCEL_ADMIN_DEPLOY_HOOK_URL is not set. Vercel native GitHub integration will automatically build and deploy apps/admin on push to main."
