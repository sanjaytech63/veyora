name: Veyora Production Deployment (Google Cloud Run & Vercel)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required for Google Cloud Workload Identity Federation (Zero static secrets)

jobs:
  validate-and-gate:
    name: Pre-Deployment Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Align npm with packageManager
        run: npm install --global npm@11.21.0

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Verify compilation and tests
        run: |
          npm run typecheck
          npm run lint:check
          npm run format:check
          npm run test
          npm run build

  deploy-gcp-cloud-run:
    name: Build & Deploy to Google Cloud Run
    needs: [validate-and-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Google Cloud using Workload Identity Federation (No JSON keys)
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev --quiet

      - name: Define Image Tags
        id: meta
        run: |
          REGISTRY="${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO || 'veyora-docker-repo' }}"
          SHA_TAG="${{ github.sha }}"
          echo "api_image=${REGISTRY}/veyora-api:${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "api_image_latest=${REGISTRY}/veyora-api:latest" >> $GITHUB_OUTPUT
          echo "worker_image=${REGISTRY}/veyora-worker:${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "worker_image_latest=${REGISTRY}/veyora-worker:latest" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # Build & Push API Image
      # ------------------------------------------------------------------------
      - name: Build & Push API Image to Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}
            ${{ steps.meta.outputs.api_image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # Build & Push Worker Image
      # ------------------------------------------------------------------------
      - name: Build & Push Worker Image to Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.worker_image }}
            ${{ steps.meta.outputs.worker_image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # Deploy API to Google Cloud Run
      # ------------------------------------------------------------------------
      - name: Deploy API Service to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: veyora-api
          image: ${{ steps.meta.outputs.api_image }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}

      # ------------------------------------------------------------------------
      # Verify API Health Probe
      # ------------------------------------------------------------------------
      - name: Verify Deployed API Liveness Endpoint
        run: |
          API_URL="${{ steps.deploy-api.outputs.url }}"
          echo "Probing API at ${API_URL}/health/live..."
          curl -s -f --retry 5 --retry-delay 5 "${API_URL}/health/live"
          echo "API Liveness verification passed."

      # ------------------------------------------------------------------------
      # Deploy Worker to Google Cloud Run (Dedicated Background Execution)
      # ------------------------------------------------------------------------
      - name: Deploy Worker Service to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: veyora-worker
          image: ${{ steps.meta.outputs.worker_image }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          flags: --no-cpu-throttling --min-instances=1 --max-instances=3 --no-allow-unauthenticated

  deploy-vercel:
    name: Trigger Vercel Deployments (Web & Admin)
    needs: [validate-and-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Web Deploy Hook
        if: env.VERCEL_WEB_DEPLOY_HOOK_URL != ''
        env:
          VERCEL_WEB_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_WEB_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel Web Storefront deployment..."
          curl -s -f -X POST "${VERCEL_WEB_DEPLOY_HOOK_URL}"
          echo "Vercel Web deployment hook dispatched."

      - name: Trigger Vercel Admin Deploy Hook
        if: env.VERCEL_ADMIN_DEPLOY_HOOK_URL != ''
        env:
          VERCEL_ADMIN_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_ADMIN_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel Admin Portal deployment..."
          curl -s -f -X POST "${VERCEL_ADMIN_DEPLOY_HOOK_URL}"
          echo "Vercel Admin deployment hook dispatched."
