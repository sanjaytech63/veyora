services:
  mongodb:
    image: mongo:7.0
    container_name: veyora-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-veyora_mongo_dev}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-veyora_dev}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --eval ''db.adminCommand("ping")'' || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - veyora-network

  redis:
    image: redis:7.2-alpine
    container_name: veyora-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-veyora_redis_dev}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-veyora_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - veyora-network

volumes:
  mongodb_data:
    name: veyora_mongodb_data
    driver: local
  redis_data:
    name: veyora_redis_data
    driver: local

networks:
  veyora-network:
    name: veyora_network
    driver: bridge
