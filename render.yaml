services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: veyora-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm run build:packages && npm run build --workspace=@veyora/api
    startCommand: npm run start --workspace=@veyora/api
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: veyora
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: BODY_LIMIT
        value: 10mb
      - key: LOG_LEVEL
        value: info

  # ----------------------------------------------------------------------------
  # Background Worker Service
  # ----------------------------------------------------------------------------
  - type: worker
    name: veyora-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm run build:packages && npm run build --workspace=@veyora/worker
    startCommand: npm run start --workspace=@veyora/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CONCURRENCY
        value: 5
      - key: STOREFRONT_URL
        sync: false
      - key: INTERNAL_CACHE_SECRET
        sync: false
