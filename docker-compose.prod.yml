# ==============================================================================
# Veyora Monorepo - Production Docker Compose Stack
# Multi-container orchestration with healthchecks, isolated networks, and resource limits
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database Engine
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: veyora-prod-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: veyora_production
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:?MONGO_ROOT_USER must be set}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - veyora-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & BullMQ Message Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: veyora-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - veyora-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Core REST & WebSocket API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: veyora-prod-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      CORS_ORIGIN: "${CORS_ORIGIN:?CORS_ORIGIN must be set}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID must be set}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET must be set}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET must be set}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME must be set}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY must be set}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET must be set}"
      COOKIE_SECRET: "${COOKIE_SECRET:?COOKIE_SECRET must be set}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}"
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
      MONGODB_URI: "${MONGODB_URI:?MONGODB_URI must be set to the authenticated MongoDB service URI}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - veyora-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 4. Asynchronous Queue Worker Suite
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: veyora-prod-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: "${MONGODB_URI:?MONGODB_URI must be set to the authenticated MongoDB service URI}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      CONCURRENCY: 5
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - veyora-network

  # ----------------------------------------------------------------------------
  # 5. Customer Storefront Web Application
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: veyora-prod-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: "http://api:4000/api/v1"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_WEB_URL: "http://localhost:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - veyora-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 6. Merchant & Admin Operations Console
  # ----------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: veyora-prod-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_API_URL: "http://api:4000/api/v1"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_ADMIN_URL: "http://localhost:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - veyora-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  veyora-network:
    name: veyora_production_network
    driver: bridge

volumes:
  mongodb_data:
    name: veyora_prod_mongodb_data
  redis_data:
    name: veyora_prod_redis_data
